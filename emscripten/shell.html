<!doctype html>
<html lang="en-us" data-theme="dark">
  <head>
    <script src="coi-serviceworker.js"></script>

    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />

    <meta
      name="description"
      content="A classic Pac-Man clone built in C++ with SFML/VRSFML, playable directly in the browser via WebAssembly."
    />
    <meta name="author" content="Booker Okumu" />
    <link rel="canonical" href="https://pacman.bkokumu.com" />

    <title>Pac-Man</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23ffe600'/><path d='M50 50 L92 24 A46 46 0 1 0 92 76 Z' fill='%23000'/><circle cx='58' cy='30' r='6' fill='%23000'/></svg>"
    />

    <style>
      :root {
        /* Pac-Man palette: black maze background, yellow Pac-Man,
           blue maze walls, ghost colors as accent highlights. */
        --bg: #000000;
        --bg-elev: #0a0a1a;
        --fg: #ffe600;
        --muted: #8a8fa3;
        --border: #2121de;
        --accent: #ffe600;
        --accent-soft: rgba(255, 230, 0, 0.12);
        --ghost-red: #ff0000;
        --ghost-pink: #ffb8de;
        --ghost-cyan: #00ffff;
        --ghost-orange: #ffb851;
        /* No external font dependency -- a bold system monospace stack,
           styled with uppercase + letter-spacing, reads close enough to
           an arcade pixel font while working fully offline. */
        --code-font:
          ui-monospace, 'Cascadia Mono', 'Consolas', 'Courier New', monospace;
        --sans:
          ui-monospace, 'Cascadia Mono', 'Consolas', 'Courier New', monospace;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }
      .progress-wrap:has(> progress[hidden]) {
        display: none;
      }

      html,
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--sans);
        line-height: 1.8;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-weight: 700;
        /* Faint maze-dot texture across the whole page */
        background-image: radial-gradient(var(--border) 1px, transparent 1px);
        background-size: 28px 28px;
        background-position: 14px 14px;
      }

      a {
        color: var(--ghost-cyan);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      /* ============================================================== */
      /* Top bar                                                          */
      /* ============================================================== */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.9rem 1.25rem;
        border-bottom: 3px solid var(--border);
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: saturate(140%) blur(8px);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .topbar .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        font-family: var(--code-font);
        font-weight: 700;
        font-size: 0.95rem;
        letter-spacing: 0.08em;
        color: var(--fg);
        text-shadow: 0 0 6px var(--accent-soft);
      }
      .topbar .brand:hover {
        text-decoration: none;
        color: var(--accent);
      }

      /* CSS-only Pac-Man: a yellow circle with a wedge mouth cut out. */
      .pacman-icon {
        display: inline-block;
        width: 1.4rem;
        height: 1.4rem;
        background: var(--accent);
        border-radius: 50%;
        clip-path: polygon(
          100% 74%,
          44% 50%,
          100% 26%,
          100% 0%,
          0% 0%,
          0% 100%,
          100% 100%
        );
        flex-shrink: 0;
      }

      .topbar .links {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .topbar .icon-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.3rem;
        height: 2.3rem;
        border-radius: 0.3rem;
        color: var(--fg);
        transition:
          background-color 120ms ease,
          color 120ms ease;
      }
      .topbar .icon-link:hover {
        background: var(--accent-soft);
        color: var(--accent);
        text-decoration: none;
      }

      /* ============================================================== */
      /* Stage layout                                                     */
      /* ============================================================== */
      .stage {
        flex: 1;
        width: 100%;
        margin: 0 auto;
      }

      /* ============================================================== */
      /* Status + progress                                                */
      /* ============================================================== */
      .status {
        text-align: center;
        font-family: var(--code-font);
        font-size: 0.8rem;
        color: var(--muted);
        min-height: 1.4rem;
        margin: 0.25rem 0 0.9rem;
        letter-spacing: 0.04em;
      }

      .progress-wrap {
        display: flex;
        justify-content: center;
        margin-bottom: 1.2rem;
      }

      progress {
        appearance: none;
        -webkit-appearance: none;
        width: 60%;
        max-width: 24rem;
        height: 10px;
        border: 2px solid var(--border);
        border-radius: 0;
        background: var(--bg-elev);
        overflow: hidden;
      }
      progress::-webkit-progress-bar {
        background: var(--bg-elev);
      }
      progress::-webkit-progress-value {
        background: var(--accent);
      }
      progress::-moz-progress-bar {
        background: var(--accent);
      }

      /* ============================================================== */
      /* Spinner -- a chomping, spinning Pac-Man                          */
      /* ============================================================== */
      #spinner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        margin: 1.5rem 0;
      }
      #spinner figcaption,
      #spinner > div + center,
      #spinner strong {
        color: var(--muted);
        font-family: var(--code-font);
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--accent);
        clip-path: polygon(
          100% 74%,
          44% 50%,
          100% 26%,
          100% 0%,
          0% 0%,
          0% 100%,
          100% 100%
        );
        animation:
          chomp 0.6s steps(2) infinite,
          spin 1.1s linear infinite;
        filter: drop-shadow(0 0 6px var(--accent-soft));
      }
      @keyframes chomp {
        0% {
          clip-path: polygon(
            100% 74%,
            44% 50%,
            100% 26%,
            100% 0%,
            0% 0%,
            0% 100%,
            100% 100%
          );
        }
        50% {
          clip-path: polygon(
            100% 50%,
            100% 50%,
            100% 50%,
            100% 0%,
            0% 0%,
            0% 100%,
            100% 100%
          );
        }
        100% {
          clip-path: polygon(
            100% 74%,
            44% 50%,
            100% 26%,
            100% 0%,
            0% 0%,
            0% 100%,
            100% 100%
          );
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ============================================================== */
      /* Canvas frame                                                     */
      /* ============================================================== */
      .canvas-frame {
        display: flex;
        justify-content: center;
        margin: 0 auto;
        padding: 0;
        border: 3px solid var(--border);
        border-radius: 0.3rem;
        background: #000;
        overflow: hidden;
        width: max-content;
        max-width: 100%;
        box-shadow:
          0 0 0 1px #000,
          0 0 24px rgba(33, 33, 222, 0.55),
          0 12px 40px rgba(0, 0, 0, 0.6);
      }

      canvas.emscripten {
        border: 0px none;
        padding: 0;
        margin: 0;
        background-color: black;
        display: block;
      }

      /* Center the canvas and preserve aspect ratio (letterbox/pillarbox)
         when the browser's native Fullscreen API takes it fullscreen.
         Without this, the canvas keeps its original pixel size and sits
         anchored at the top-left of the fullscreen viewport, leaving
         empty space around it. Vendor prefixes cover older Safari/Firefox. */
      canvas.emscripten:fullscreen,
      canvas.emscripten:-webkit-full-screen,
      canvas.emscripten:-moz-full-screen,
      canvas.emscripten:-ms-fullscreen {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background-color: black;
      }

      /* ============================================================== */
      /* Action bar                                                       */
      /* ============================================================== */
      .canvas-actions {
        display: flex;
        justify-content: center;
        gap: 0.6rem;
        margin: 1.25rem 0;
      }

      .btn {
        appearance: none;
        -webkit-appearance: none;
        font-family: var(--code-font);
        font-weight: 700;
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        padding: 0.65rem 1.1rem;
        border-radius: 0;
        border: 2px solid var(--border);
        background: var(--bg-elev);
        color: var(--fg);
        cursor: pointer;
        text-transform: uppercase;
        transition:
          border-color 120ms ease,
          background-color 120ms ease,
          color 120ms ease,
          box-shadow 120ms ease;
      }
      .btn:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent);
        box-shadow: 0 0 10px var(--accent-soft);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* ============================================================== */
      /* Console output                                                   */
      /* ============================================================== */
      details.console {
        max-width: 64rem;
        margin: 1.5rem auto 0;
        border: 2px solid var(--border);
        border-radius: 0.3rem;
        background: var(--bg-elev);
        overflow: hidden;
      }

      details.console summary {
        list-style: none;
        cursor: pointer;
        padding: 0.6rem 0.9rem;
        font-family: var(--code-font);
        font-weight: 700;
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        user-select: none;
      }
      details.console summary::-webkit-details-marker {
        display: none;
      }
      details.console summary::before {
        content: '▸';
        display: inline-block;
        margin-right: 0.5rem;
        color: var(--ghost-cyan);
        transition: transform 120ms ease;
      }
      details.console[open] > summary::before {
        transform: rotate(90deg);
      }

      details.console summary:hover {
        color: var(--fg);
      }

      textarea.emscripten {
        font-family: var(--code-font);
        font-size: 0.78rem;
        line-height: 1.6;
        width: 100%;
        border: 0;
        border-top: 2px solid var(--border);
        background: var(--bg);
        color: var(--ghost-cyan);
        padding: 0.85rem 0.9rem;
        resize: vertical;
        outline: none;
        display: block;
      }

      /* ============================================================== */
      /* Footer                                                           */
      /* ============================================================== */
      .foot {
        text-align: center;
        font-family: var(--code-font);
        font-size: 0.72rem;
        letter-spacing: 0.03em;
        color: var(--muted);
        padding: 1.25rem;
        border-top: 3px solid var(--border);
      }
      .foot a {
        color: var(--ghost-orange);
      }
      .foot a:hover {
        color: var(--accent);
      }

      /* Small color accents, ghost-style, so the four classic ghost
         colors are represented somewhere on the page. */
      .foot .dot:nth-of-type(1) {
        color: var(--ghost-red);
      }
      .foot .dot:nth-of-type(2) {
        color: var(--ghost-pink);
      }
      .foot .dot:nth-of-type(3) {
        color: var(--ghost-cyan);
      }
      .foot .dot:nth-of-type(4) {
        color: var(--ghost-orange);
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <span class="brand">
        <span class="pacman-icon" aria-hidden="true"></span>
        PAC-MAN
      </span>
      <div class="links">
        <a
          href="https://github.com/KOKUMUbooker/Pacman_game"
          target="_blank"
          rel="noopener"
          class="icon-link"
          aria-label="GitHub repository"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.36-3.87-1.36-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.69 1.25 3.35.95.1-.74.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.04 0 0 .97-.31 3.18 1.17.92-.26 1.91-.39 2.9-.39s1.98.13 2.9.39c2.21-1.48 3.18-1.17 3.18-1.17.62 1.58.23 2.75.11 3.04.74.8 1.18 1.82 1.18 3.08 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.07.78 2.16v3.2c0 .31.21.67.8.55C20.21 21.39 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5z"
            />
          </svg>
        </a>
      </div>
    </header>

    <main class="stage">
      <figure id="spinner">
        <div class="spinner"></div>
        <figcaption>loading</figcaption>
      </figure>

      <div class="status" id="status">Downloading...</div>

      <div class="progress-wrap">
        <progress value="0" max="100" id="progress" hidden="1"></progress>
      </div>

      <div class="canvas-frame">
        <canvas
          class="emscripten"
          id="canvas"
          oncontextmenu="event.preventDefault()"
          tabindex="-1"
        ></canvas>
      </div>

      <!-- <div class="canvas-actions">
        <button class="btn" onclick="Module.requestFullscreen(false, false)">
          Fullscreen
        </button>
      </div> -->

      <details class="console">
        <summary>Console output</summary>
        <textarea class="emscripten" id="output" rows="8" readonly></textarea>
      </details>
    </main>

    <footer class="foot">
      <span class="dot">●</span> <span class="dot">●</span>
      <span class="dot">●</span> <span class="dot">●</span>
    </footer>

    <!-- ============================================================== -->
    <!-- Emscripten Module init -- UNCHANGED from the original shell      -->
    <!-- ============================================================== -->
    <script type="text/javascript">
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');

      var Module = (typeof Module === 'object' && Module) || {};
      Object.assign(Module, {
        print: (function () {
          var element = document.getElementById('output');
          if (element) element.value = '';
          return (...args) => {
            var text = args.join(' ');
            console.log(text);
            if (element) {
              element.value += text + '\n';
              element.scrollTop = element.scrollHeight;
            }
          };
        })(),
        canvas: (() => {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener(
            'webglcontextlost',
            (e) => {
              alert('WebGL context lost. You will need to reload the page.');
              e.preventDefault();
            },
            false,
          );
          return canvas;
        })(),
        setStatus: (text) => {
          if (!Module.setStatus.last)
            Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return;
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2]) * 100;
            progressElement.max = parseInt(m[4]) * 100;
            progressElement.hidden = false;
            spinnerElement.hidden = false;
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;
            if (!text) spinnerElement.hidden = true;
          }
          statusElement.innerHTML = text;
        },
        totalDependencies: 0,
        monitorRunDependencies: (left) => {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(
            left
              ? 'Preparing... (' +
                  (this.totalDependencies - left) +
                  '/' +
                  this.totalDependencies +
                  ')'
              : 'All downloads complete.',
          );
        },
      });
      Module.setStatus('Downloading...');
      window.onerror = () => {
        Module.setStatus('Exception thrown, see JavaScript console');
        spinnerElement.style.display = 'none';
        Module.setStatus = (text) => {
          if (text) console.error('[post-exception status] ' + text);
        };
      };
    </script>

  </body>
</html>
